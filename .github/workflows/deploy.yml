name: Deploy to GitHub Pages

on:
  # Deploy on every push to the default branch
  push:
    branches:
      - master
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions required for the GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the
# run in-progress and latest queued. Do not cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.5.0 --activate

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Debug pnpm
        run: |
          pnpm --version
          ls -la pnpm-lock.yaml

      - name: Install dependencies
        env:
          PNPM_HOME: /tmp
          PNPM_STORE_DIR: /tmp/.pnpm-store
        run: pnpm install

      - name: Build with Next.js
        # base_path is like "/repo-name"; Next.js uses it for basePath/assetPrefix
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build

      - name: Create .nojekyll
        run: touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
